<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index| Rafting Travel</title>
    <meta name="description"
      content="Discover exciting whitewater rafting adventures with Rafting Travel. Explore thrilling river trips, scenic destinations, and unforgettable outdoor experiences for every skill level.">
    <meta name="author" content="Julie Jensen">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-raftingcompas.jpg" alt="Rafting Logo" width="200" height="200">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <div class="grid">

        <main>
            <section class="home-hero">
                <img src="images/hero_transparency_1024.png"
                  alt="Rafting group in whitewater rapids " width="200" height="300">

                <h1>Adventures Begin Here!</h1>
                <div>
                    <button class="now" onclick="window.location.href='trips.html'">Book
                        Now!</button>
                </div>

            </section>

            <section class="choose">
                <h2>Why Choose Us?</h2>

                <figure>
                    <img src="images/employees.jpeg" alt="experiences staff">
                    <figcaption>Experienced Guides!</figcaption>
                </figure>

                <figure>
                    <img src="images/everyone.jpeg" alt="Fun for the wh">
                    <figcaption>Adventures for Everyone!</figcaption>
                </figure>

            </section>

            <section class=" newsletter">
                <div>
                    <img src="images/image_410db372.png" alt="sign up for the newsletter">
                </div>
                <form>
                    <div class="form-item column1">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required placeholder="Placeholder">
                    </div>
                    <div class="form-item column2">
                        <label for="useremail">Email:</label>
                        <input type="email" id="useremail" name="useremail" required
                          placeholder="Placeholder">
                    </div>
                    <div>
                        <input type="checkbox" id="subscribe" name="subscribe">
                        <label for="subscribe">Please Subscribe me to the monthly
                            newsletter</label>
                    </div>
                    <div>
                        <button type="submit">Sign Me Up!</button>
                    </div>
                </form>
            </section>


        </main>

        <footer>
            <p> © 2026 🌸 Rafting Travel 🌸 Julie Jensen </p>
            <nav class="socialmedia">
                <a href="https://www.facebook.com/">
                    <img src="images/facebook-square.svg" alt="Facebook Icon" width="50">
                </a>
                <a href="https://www.instagram.com/?hl=en">
                    <img src="images/instagram-square.svg" alt="Instagram Icon" width="50">
                </a>
                <a href="https://www.youtube.com/">
                    <img src="images/youtube.png" alt="Youtube Icon" width="50">
                </a>
            </nav>
        </footer>

    </div>


</body>
