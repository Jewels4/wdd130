<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rafting Travel</title>
    <meta name="description"
      content="Get in touch with White Water Rafting. Contact us with questions, book a trip, or learn more about our exciting rafting adventures.">
    <meta name="author" content="Julie Jensen">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-raftingcompas.jpg" alt="Rafting Logo" width="200" height="200">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>


    <main>
        <div class="contact-info">
            <h1>Rafting Travel</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>Phone:+1 999-999-9999</p>
            <p>Email: <a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
        </div>

        <section class="contact-grid">
            <h2 class="visually-hidden">Contact Information and Message Form</h2>
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d6867.962339124306!2d-120.46695437525891!3d47.52408597601596!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1786061936917!5m2!1sen!2sus"
                  width="600" height="450" allowfullscreen loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <form>
                <div class="form-item column1">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Placeholder">
                </div>
                <div class="form-item column2">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required
                      placeholder="Placeholder">
                </div>
                <div class="form-item">
                    <label class="main-label">Message Purpose</label>
                    <fieldset class="radio-stack">
                        <label><input type="radio" id="general" name="purpose" value="general"
                              checked>General
                            Inquiry
                        </label>
                        <label>
                            <input type="radio" id="reservation" name="purpose" value="general"
                              checked>
                            Reservation Question
                        </label>
                        <label>
                            <input type="radio" id="suggestion" name="purpose" value="general"
                              checked>
                            Website Suggestion
                        </label>
                    </fieldset>

                </div>
                <div>
                    <label for="feedback" class="textarea-label">
                        Message
                    </label>
                </div>
                <textarea id="feedback" name="feedback" rows="4" placeholder="Type here"></textarea>
                <div>
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                </div>
                <div>
                    <button type="submit">Get in Touch!</button>
                </div>
            </form>
        </section>


        <section class="contact-employees">
            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/jim.jpeg" alt="Jim Doe">
                <figcaption>Jim Doe<br>
                    Whitewater River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/jane.jpeg" alt="Jane Doe">
                <figcaption>Jane Doe<br>
                    Client Services Area Coordinator</figcaption>
            </figure>

            <figure>
                <img src="images/john-doe.jpeg" alt="John Doe">
                <figcaption>John Doe<br>
                    Whitewater River Guide</figcaption>
            </figure>


        </section>

    </main>

    <footer>
        <p> © 2026 🌸 Rafting Travel 🌸 Julie Jensen </p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/facebook-square.svg" alt="Facebook Icon" width="50">
            </a>
            <a href="https://www.instagram.com/?hl=en">
                <img src="images/instagram-square.svg" alt="Instagram Icon" width="50">
            </a>
            <a href="https://www.youtube.com/">
                <img src="images/youtube.png" alt="Youtube Icon" width="50">
            </a>
        </nav>
    </footer>

</body>

</html>
